[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracking-claim-audit"
version = "0.1.0"
description = "Offline audit of documented cross-frame following capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
tracking-claim-audit = "tracking_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["tracking_claim_audit*"]
